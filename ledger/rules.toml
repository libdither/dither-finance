# Keyword rules: a generic starter set. Put your own in $FINANCE_HOME/data/rules.toml (same format); when that file
# exists it is used in place of this one, so start by copying this file there.
#
# Each pattern is a Python regex matched against the upper-cased description; the first match wins, so put the
# narrower pattern first. Categories are the names in ledger/categories.py CATEGORIES.
#   spend, income:       [pattern, category, merchant]   (merchant is optional: without it, one is read off the description)
#   venmo_out, venmo_in: [pattern, category]             (matched against a Venmo payment's note)
#   tags:                [pattern, [tag, ...]]

